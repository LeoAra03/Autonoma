[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonoma-agent"
version = "1.1.0"
description = "Agente local de terminal con aprobación humana de herramientas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "rich>=13.7,<15",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5.2,<7",
  "psutil>=6,<8",
]

[project.optional-dependencies]
keyboard = ["pynput>=1.7.7,<2"]
browser = ["playwright>=1.47,<2"]
build = ["pyinstaller>=6.10,<7"]
test = ["pytest>=9.0.3,<10", "pytest-cov>=6,<8"]

[project.scripts]
autonoma = "autonoma.cli:main"

[tool.setuptools.packages.find]
include = ["autonoma*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
