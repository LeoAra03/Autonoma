name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: modules
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
      - name: verify
        shell: pwsh
        run: |
          ./tools/verify.ps1 2>&1 | Tee-Object -FilePath verify.log | Out-Host
      - name: attest verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log
          path: verify.log
      - name: attest provenance
        if: always()
        uses: actions/attest@v2
        with:
          artifact-path: verify.log
