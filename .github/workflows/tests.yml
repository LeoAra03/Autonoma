name: Quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "./autonoma-agent[test,check]"
      - name: Lint (ruff, configuración del proyecto)
        working-directory: autonoma-agent
        run: ruff check autonoma tests scripts run_autonoma.py
      - name: Tipos (mypy --strict, desde la config del proyecto)
        working-directory: autonoma-agent
        run: mypy autonoma
      - name: Tipos para Windows (mypy --platform win32)
        # Caza atributos que sólo existen en un SO (os.killpg, ctypes.windll) antes de
        # que aparezcan como errores opacos en el job de Windows.
        if: runner.os == 'Linux'
        working-directory: autonoma-agent
        run: mypy --platform win32 autonoma
      - name: Empaquetado (la versión se resuelve desde autonoma/_version.py)
        working-directory: autonoma-agent
        run: python -m pip install --quiet build && python -m build --wheel --outdir dist-ci . && python -c "import glob,zipfile; n=sorted(glob.glob('dist-ci/*.whl'))[0]; zf=zipfile.ZipFile(n); print(n.split('/')[-1]); assert 'autonoma/py.typed' in zf.namelist(); assert b'__version__' in zf.read('autonoma/_version.py')"
      - run: python -m compileall -q -o 2 autonoma-agent/autonoma
      - run: python -m pytest autonoma-agent/tests --cov=autonoma --cov-branch --cov-report=term-missing
      - run: autonoma --version
  locked-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r autonoma-agent/requirements-lock.txt
      - run: python -m pytest autonoma-agent/tests --cov=autonoma --cov-branch
      - run: python -m pip install pip-audit build
      - run: pip-audit --require-hashes -r autonoma-agent/requirements-lock.txt
      - run: python -m build autonoma-agent
  windows-executable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "./autonoma-agent[build,keyboard,test]"
      - run: python -m pytest autonoma-agent/tests/test_windows_readiness.py -q
      - name: Build Windows console executable
        working-directory: autonoma-agent
        run: python -m PyInstaller --noconfirm --clean autonoma.spec
      - name: Smoke test executable without credentials
        working-directory: autonoma-agent
        shell: pwsh
        run: |
          $env:AUTONOMA_HOME = Join-Path $env:RUNNER_TEMP 'autonoma-smoke'
          & .\dist\Autonoma.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Version smoke test failed' }
          $raw = & .\dist\Autonoma.exe --doctor --json
          if ($LASTEXITCODE -ne 0) { throw 'Doctor smoke test failed' }
          $report = ($raw -join "`n") | ConvertFrom-Json
          if (-not $report.local_checks_passed) { throw 'Local checks failed' }
          if ($report.network_tested) { throw 'Offline smoke test must not contact providers' }
          & .\dist\Autonoma.exe --selftest --json | ConvertFrom-Json | ForEach-Object {
            if (-not $_.ok) { throw "selftest falló: $($_.checks | ConvertTo-Json -Compress)" }
          }
          if ($LASTEXITCODE -ne 0) { throw 'Selftest smoke test failed' }
          $hash = (Get-FileHash .\dist\Autonoma.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Autonoma.exe" | Set-Content .\dist\Autonoma.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Autonoma-Windows-unsigned
          path: |
            autonoma-agent/dist/Autonoma.exe
            autonoma-agent/dist/Autonoma.exe.sha256
          if-no-files-found: error

  portable-linux:
    name: Binario portable (Linux) + zipapp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "./autonoma-agent[test,build,keyboard]"
      - name: Compilar binario portable
        working-directory: autonoma-agent
        run: bash scripts/build_portable.sh
      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          # Se publica el directorio completo: `build_portable.sh` deja el binario one-file
          # o, si el runner carece de `libpython` compartida, el zipapp autoverificado.
          name: Autonoma-Linux-portable
          path: autonoma-agent/dist/
          if-no-files-found: error

  release:
    name: Publicar ejecutables
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, locked-linux, windows-executable, portable-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'Autonoma-*'
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
