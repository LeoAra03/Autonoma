name: Quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 20  # un test colgado debe verse como fallo en minutos, no como 6 horas de CI
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "./autonoma-agent[test,check]"
      - name: Lint (ruff, configuración del proyecto)
        working-directory: autonoma-agent
        run: ruff check autonoma tests scripts run_autonoma.py
      - name: Tipos (mypy --strict, desde la config del proyecto)
        working-directory: autonoma-agent
        run: mypy autonoma
      - name: Tipos para Windows (mypy --platform win32)
        # Caza atributos que sólo existen en un SO (os.killpg, ctypes.windll) antes de
        # que aparezcan como errores opacos en el job de Windows.
        if: runner.os == 'Linux'
        working-directory: autonoma-agent
        run: mypy --platform win32 autonoma
      - name: Empaquetado (la versión se resuelve desde autonoma/_version.py)
        working-directory: autonoma-agent
        run: python -m pip install --quiet build && python -m build --wheel --outdir dist-ci . && python -c "import glob,zipfile; n=sorted(glob.glob('dist-ci/*.whl'))[0]; zf=zipfile.ZipFile(n); print(n.split('/')[-1]); assert 'autonoma/py.typed' in zf.namelist(); assert b'__version__' in zf.read('autonoma/_version.py')"
      - run: python -m compileall -q -o 2 autonoma-agent/autonoma
      - name: "Recolección (un import colgado se ve aquí, no en el paso de pruebas)"
        shell: bash
        # `pytest-timeout` no puede interrumpir un import: si un módulo de prueba bloquea
        # al cargarse, el job cuelga hasta el límite del runner. Se recolecta aparte y con
        # `timeout`, así que el fallo dice "recolección" en lugar de ser una rueda amarilla.
        run: |
          set +e
          timeout 300 python -m pytest autonoma-agent/tests --collect-only -q > /tmp/collect.log 2>&1
          code="$?"
          cat /tmp/collect.log
          if [ "$code" -ne 0 ]; then
            echo "::error::pytest --collect-only exit=$code (124 = colgado al recolectar) :: $(tail -c 600 /tmp/collect.log | tr '\r\n' '  ')"
          fi
          exit "$code"
      - name: "Pruebas de la capa nueva (acotadas y con el nombre de cada test)"
        shell: bash
        # Los tres archivos nuevos se ejecutan aparte, en crudo y con `-v`: si algo de aquí
        # bloquea, el paso se llama como su contenido y la última línea nombra el test.
        run: |
          set +e
          timeout 240 python -m pytest autonoma-agent/tests/test_bootstrap.py autonoma-agent/tests/test_portable_bundle.py autonoma-agent/tests/test_repo_installer.py -v --timeout=60 > /tmp/new.log 2>&1
          code="$?"
          cat /tmp/new.log
          if [ "$code" -ne 0 ]; then
            echo "::error::pruebas nuevas exit=$code (124 = colgado; último nombre del log = test sospechoso) :: $(tail -c 900 /tmp/new.log | tr '\r\n' '  ')"
          fi
          exit "$code"
      - name: "Pruebas (puerta de cobertura dura en Linux; medida en Windows)"
        shell: bash
        # En Windows las ramas protegidas por plataforma (grupos de procesos POSIX,
        # geteuid, symlinks) quedan sin ejecutar, así que el umbral de cobertura sólo
        # se exige en Linux; allí se conserva como contrato. El fallo se publica como
        # anotación para que sea legible sin abrir los logs.
        run: |
          set +e
          floor=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            # En Windows hay ramas que no se pueden ejecutar (grupos de procesos POSIX,
            # os.geteuid, symlinks, pynput/X11), así que allí la cobertura se mide pero no
            # se usa de puerta: el umbral de 80% del proyecto se exige en Linux y en el
            # job `locked-linux`, donde el árbol completo es alcanzable.
            floor="--cov-fail-under=0"
          fi
          # Sin `| tee`: si un test deja un hijo huérfano con la tubería abierta, `tee` no ve
          # el EOF y el paso se queda colgado para siempre, más allá de cualquier cota.
          timeout 900 python -m pytest autonoma-agent/tests --cov=autonoma --cov-branch \
            --cov-report=term-missing -v --timeout=120 $floor > /tmp/pytest.log 2>&1
          code="$?"
          cat /tmp/pytest.log
          set -e
          if [ "$code" -ne 0 ]; then
            fails=$(grep -E "^(FAILED|ERROR)" /tmp/pytest.log | head -12 | tr '\n' '|' || true)
            tail=$(tail -c 1200 /tmp/pytest.log | tr '\r\n' '  ' || true)
            echo "::error::pytest exit=$code (124 = colgado) :: ${fails:-sin FAILED/ERROR en el resumen; cola del log abajo}"
            echo "::error::log tail :: $tail"
          fi
          exit "$code"
      - run: autonoma --version
  locked-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r autonoma-agent/requirements-lock.txt
      - run: python -m pytest autonoma-agent/tests --cov=autonoma --cov-branch
      - run: python -m pip install pip-audit build
      - run: pip-audit --require-hashes -r autonoma-agent/requirements-lock.txt
      - run: python -m build autonoma-agent
  windows-executable:
    timeout-minutes: 25
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "./autonoma-agent[build,keyboard,test]"
      - run: python -m pytest autonoma-agent/tests/test_windows_readiness.py -q
      - name: Build Windows console executable
        working-directory: autonoma-agent
        run: python -m PyInstaller --noconfirm --clean autonoma.spec
      - name: Smoke test executable without credentials
        working-directory: autonoma-agent
        shell: pwsh
        run: |
          $env:AUTONOMA_HOME = Join-Path $env:RUNNER_TEMP 'autonoma-smoke'
          & .\dist\Autonoma.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Version smoke test failed' }
          $raw = & .\dist\Autonoma.exe --doctor --json
          if ($LASTEXITCODE -ne 0) { throw 'Doctor smoke test failed' }
          $report = ($raw -join "`n") | ConvertFrom-Json
          if (-not $report.local_checks_passed) { throw 'Local checks failed' }
          if ($report.network_tested) { throw 'Offline smoke test must not contact providers' }
          & .\dist\Autonoma.exe --selftest --json | ConvertFrom-Json | ForEach-Object {
            if (-not $_.ok) { throw "selftest falló: $($_.checks | ConvertTo-Json -Compress)" }
          }
          if ($LASTEXITCODE -ne 0) { throw 'Selftest smoke test failed' }
          $hash = (Get-FileHash .\dist\Autonoma.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Autonoma.exe" | Set-Content .\dist\Autonoma.exe.sha256
          python ..\scripts\make_bundle.py --platform windows --dist-dir dist
          # El ZIP es un extra de comodidad: si algo falla, el .exe verificado sigue siendo el entregable.
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        with:
          name: Autonoma-Windows-unsigned
          path: |
            autonoma-agent/dist/Autonoma.exe
            autonoma-agent/dist/Autonoma.exe.sha256
            autonoma-agent/dist/Autonoma-Portable-windows*.zip
            autonoma-agent/dist/Autonoma-Portable-windows*.zip.sha256
          if-no-files-found: error

  portable-linux:
    name: Binario portable (Linux) + zipapp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "./autonoma-agent[test,build,keyboard]"
      - name: Compilar binario portable (y armar el ZIP de copiar-y-usar)
        working-directory: autonoma-agent
        run: bash scripts/build_portable.sh
      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          # Se publica el directorio completo: `build_portable.sh` deja el binario one-file
          # o, si el runner carece de `libpython` compartida, el zipapp autoverificado.
          name: Autonoma-Linux-portable
          path: autonoma-agent/dist/
          if-no-files-found: error

  installer:
    name: "Instalador de un comando (npm start)"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: "setup: crea .venv e instala desde cero"
        run: python scripts/bootstrap.py --no-input setup
      - name: "status: JSON legible por scripts"
        run: python scripts/bootstrap.py status
      - name: "selftest a traves del entry point instalado"
        run: python scripts/bootstrap.py --no-input selftest
      - name: "npm start, el camino de una persona no técnica"
        shell: bash
        run: |
          node scripts/bootstrap.mjs --no-input doctor
          npm start --silent -- --no-input --venv .venv selftest | tail -3
      - name: el instalador es idempotente (segunda pasada no reinstala)
        shell: bash
        run: |
          start=$(date +%s%N)
          python scripts/bootstrap.py --no-input setup
          elapsed=$(( ($(date +%s%N) - start) / 1000000 ))
          echo "segunda pasada en ${elapsed} ms"
          test "$elapsed" -lt 60000 || { echo "::error::setup no es idempotente (${elapsed} ms)"; exit 1; }

  release:
    name: Publicar ejecutables
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, locked-linux, windows-executable, portable-linux, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'Autonoma-*'
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
